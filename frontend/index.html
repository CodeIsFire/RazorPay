<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reconcile → Recover</title>
    <!-- Resolves the theme BEFORE first paint. This has to be an inline,
         non-module script: `type="module"` is deferred and would run after the
         browser has already painted, which is the flash we are avoiding.

         It always writes a concrete data-theme, never leaving it unset, because
         index.css keys both the palette and the `dark:` variant off that one
         attribute -- see the @custom-variant comment there. Storage key is
         mirrored in src/lib/theme.ts and a test asserts the two agree. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rr-theme')
          var pref = stored === 'light' || stored === 'dark' ? stored : 'system'
          var resolved =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : pref
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.colorScheme = resolved
        } catch (e) {
          /* Safari private mode throws on localStorage. Dark is the default. */
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
